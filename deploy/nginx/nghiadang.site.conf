# nghiadang.site — static portfolio
# Install: /etc/nginx/sites-available/nghiadang.site  (symlink into sites-enabled)
# Matches only nghiadang.site / www.nghiadang.site, so the other sites on this
# server keep handling their own domains. HTTPS is added by certbot --nginx.
# No [::] listen on purpose: another site already owns "[::]:443 ipv6only=on",
# and certbot would duplicate it (nginx -t fails). The domain has no AAAA record.
server {
    listen 80;
    server_name nghiadang.site www.nghiadang.site;

    root /var/www/nghiadang.site;
    index index.html;

    access_log /var/log/nginx/nghiadang.site.access.log;
    error_log  /var/log/nginx/nghiadang.site.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # Static assets: CSS/JS are cache-busted with ?v=N in index.html
    location ~* \.(?:css|js|webp|png|jpe?g|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.pdf$ {
        expires 1d;
    }

    # Never serve dotfiles
    location ~ /\. {
        deny all;
    }
}
